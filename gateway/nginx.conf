# OpenHabit gateway — single entrypoint for the whole app.
# Mirrors the Kubernetes Ingress routing exactly.
server {
    listen 8080;
    server_name _;

    # security headers (also sent for proxied responses)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; script-src 'self'; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com" always;

    # social-service (groups, invites, sharing, reactions)
    location ~ ^/api/(groups|invites|join|reactions) {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://social-service:3005;
        proxy_set_header Host $host;
    }

    # auth-service
    location /api/auth {
        proxy_pass http://auth-service:3004/auth;
        proxy_set_header Host $host;
    }

    # habit-service
    location /api/habits {
        proxy_pass http://habit-service:3001/habits;
        proxy_set_header Host $host;
    }

    # tracking-service
    location /api/entries {
        proxy_pass http://tracking-service:3002/entries;
        proxy_set_header Host $host;
    }
    location /api/wellness {
        proxy_pass http://tracking-service:3002/wellness;
        proxy_set_header Host $host;
    }

    # analytics-service
    location /api/analytics {
        proxy_pass http://analytics-service:3003/analytics;
        proxy_set_header Host $host;
    }

    # frontend (everything else)
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
