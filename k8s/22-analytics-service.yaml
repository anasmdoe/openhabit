apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: openhabit
  labels:
    app: analytics-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      containers:
      - name: analytics-service
        image: openhabit/analytics-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3003
        env:
        - name: PORT
          value: '3003'
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: JWT_SECRET
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-role-passwords
              key: ANALYTICS_DB_PASSWORD
        - name: DATABASE_URL
          value: postgres://analytics_svc:$(DB_PASSWORD)@postgres:5432/openhabit
        readinessProbe:
          httpGet:
            path: /healthz
            port: 3003
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3003
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  namespace: openhabit
  annotations:
    prometheus.io/scrape: 'true'
    prometheus.io/port: '3003'
    prometheus.io/path: /metrics
spec:
  selector:
    app: analytics-service
  ports:
  - port: 3003
    targetPort: 3003
