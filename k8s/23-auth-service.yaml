apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: openhabit
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: openhabit/auth-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3004
        env:
        - name: PORT
          value: '3004'
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: JWT_SECRET
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-role-passwords
              key: AUTH_DB_PASSWORD
        - name: DATABASE_URL
          value: postgres://auth_svc:$(DB_PASSWORD)@postgres:5432/openhabit
        - name: ALLOW_REGISTRATION
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: ALLOW_REGISTRATION
              optional: true
        - name: OIDC_ISSUER
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: OIDC_ISSUER
              optional: true
        - name: OIDC_CLIENT_ID
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: OIDC_CLIENT_ID
              optional: true
        - name: OIDC_REDIRECT_URI
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: OIDC_REDIRECT_URI
              optional: true
        - name: OIDC_POST_LOGIN_URI
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: OIDC_POST_LOGIN_URI
              optional: true
        - name: OIDC_PROVIDER_NAME
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: OIDC_PROVIDER_NAME
              optional: true
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: auth-oidc
              key: OIDC_CLIENT_SECRET
              optional: true
        readinessProbe:
          httpGet:
            path: /healthz
            port: 3004
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3004
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: openhabit
  annotations:
    prometheus.io/scrape: 'true'
    prometheus.io/port: '3004'
    prometheus.io/path: /metrics
spec:
  selector:
    app: auth-service
  ports:
  - port: 3004
    targetPort: 3004
