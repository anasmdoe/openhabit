apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: openhabit
type: Opaque
stringData:
  # Services refuse to start (CrashLoopBackOff) until this is replaced with a
  # random value of 32+ characters, e.g. `openssl rand -base64 48`.
  JWT_SECRET: change-me-to-a-long-random-string   # <-- change this

---
# ---------------------------------------------------------------------------
# OPTIONAL: OIDC / SSO configuration. Uncomment and fill in to enable
# "Sign in with SSO". Works with Authelia, Authentik, Keycloak, Zitadel,
# Google, etc. The redirect URI must be registered with your provider and
# point at this app's gateway: https://<your-host>/api/auth/oidc/callback
# ---------------------------------------------------------------------------
# apiVersion: v1
# kind: ConfigMap
# metadata:
#   name: auth-config
#   namespace: openhabit
# data:
#   ALLOW_REGISTRATION: "false"          # SSO-only instances usually disable this
#   OIDC_ISSUER: "https://auth.example.com"
#   OIDC_CLIENT_ID: "openhabit"
#   OIDC_REDIRECT_URI: "https://habits.example.com/api/auth/oidc/callback"
#   OIDC_POST_LOGIN_URI: "https://habits.example.com/"
#   OIDC_PROVIDER_NAME: "Home SSO"
# ---
# apiVersion: v1
# kind: Secret
# metadata:
#   name: auth-oidc
#   namespace: openhabit
# type: Opaque
# stringData:
#   OIDC_CLIENT_SECRET: "your-oidc-client-secret"
