# One-off schema migration for existing deployments (no data loss).
# Usage after upgrading manifests:
#   kubectl apply -f k8s/90-migrate-job.yaml
#   kubectl -n openhabit wait --for=condition=complete job/db-migrate
#   kubectl -n openhabit delete job db-migrate
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: openhabit
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: postgres:16-alpine
          # wait for Postgres, apply the schema, then (re)apply service role passwords
          command:
            - bash
            - -c
            - |
              set -e
              until pg_isready -q; do echo "waiting for postgres"; sleep 2; done
              psql -X -v ON_ERROR_STOP=1 -f /init/init.sql
              bash /init/set-db-passwords.sh
          env:
            - name: PGHOST
              value: postgres
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
          envFrom:
            - secretRef:
                name: db-role-passwords
          volumeMounts:
            - name: init
              mountPath: /init
      volumes:
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0755
